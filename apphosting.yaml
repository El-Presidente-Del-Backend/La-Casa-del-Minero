runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80

# El Admin SDK toma sus credenciales de la cuenta de servicio del backend
# (Application Default Credentials), así que no hay ningún secreto que declarar.
env:
  # Configuración pública de Firebase — expuesta al navegador por diseño.
  # Se necesita en BUILD (queda en el bundle del cliente) y en RUNTIME
  # (el Admin SDK lee el projectId y el bucket).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBmZ845hnUg6BsFGZZsx2bnAJZS9kULWeo
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: la-casa-del-minero.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: la-casa-del-minero
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: la-casa-del-minero.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "890125381246"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:890125381246:web:1fac1139426833f4e4322f
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_WHATSAPP_NUMBER
    value: "56964141800"
    availability:
      - BUILD
